[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyvyos"
version = "0.3.0"
authors = [
    { name="Roberto Berto", email="463349+robertoberto@users.noreply.github.com" },
]
description = "Python SDK for interacting with VyOS API"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/vyos-contrib/pyvyos"
Issues = "https://github.com/vyos-contrib/pyvyos/issues"

[tool.hatch.metadata]
dependencies = [
    "requests>=2.31.0,<3.0",
    "python-dotenv>=1.0.1,<2.0"
]

[tool.poetry]
name = "pyvyos"
description = "Python SDK for interacting with VyOS API"
authors = ["Roberto Berto <463349+robertoberto@users.noreply.github.com>"]
version = "0.3.0"

[tool.poetry.dependencies]
python = ">=3.8"
requests = "^2.32.0"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^6.2.5"
pytest-cov = ">=4.1,<6.0"
pytest-env = "^0.6.2"

[tool.pytest.ini_options]
testpaths = ["./tests"]
log_cli = false
log_cli_level = "DEBUG"
filterwarnings = [
    "ignore::DeprecationWarning:_pytest.assertion.rewrite",
    "ignore::DeprecationWarning:ast"
]
env = [
    "VYDEVICE_APIKEY='api_key'",
    "VYDEVICE_HOSTNAME=192.168.56.100",
    "VYDEVICE_PORT=443",
    "VYDEVICE_PROTOCOL=https",
    "VYDEVICE_VERIFY_SSL=False",
]

[tool.coverage.run]
omit = [
    "tests/*",
]